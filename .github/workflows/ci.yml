name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      aab:
        description: Auch App-Bundle (AAB) für Google Play bauen
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  # analyze + tests run in parallel to the build; publishing waits for both.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # AAB only for manual runs (checkbox) and version tags; pushes get the
      # APK only, which is all a test phone needs.
      BUILD_AAB: ${{ (github.event_name == 'workflow_dispatch' && inputs.aab) || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No keystore secrets set, signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          # Fingerprints are public; Firebase needs them for Google sign-in.
          {
            echo "### Upload key fingerprints"
            echo '```'
            keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              | grep -E 'SHA1:|SHA256:' | sed 's/^[[:space:]]*//'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Most of the build time is Dart AOT compilation per CPU type. Test
      # phones are all arm64, so the APK is built for that only.
      - name: Build APK
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-number=${{ github.run_number }}

      - name: Build App Bundle
        if: env.BUILD_AAB == 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BaCo.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab dist/BaCo.aab
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: baco-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

  # Rolling pre-release with the latest files. The download URL stays the
  # same: releases/download/test-build/BaCo.apk
  publish:
    needs: [check, build, rules]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: baco-${{ github.run_number }}
          path: dist

      - name: Publish test build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test-Build #${{ github.run_number }}" \
            --notes "Automatischer Test-Build von \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          **Am Handy installieren:** BaCo.apk herunterladen und öffnen.
          BaCo.aab (nur bei manuellen Läufen) ist für die Play Console."

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test_rules
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test_rules/package-lock.json

      - name: Install
        run: npm ci

      - name: Firestore rules tests (emulator)
        run: npm test
