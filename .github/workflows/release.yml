name: Release to Google Play

# Tag v1.2.3 -> signed App Bundle -> Play closed testing (track "alpha").
# The very first upload must be done by hand in the Play Console (see
# docs/PLAY_STORE.md); after that this workflow takes over.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play-Track
        type: choice
        # alpha = geschlossener Test
        options: [alpha, internal, beta, production]
        default: alpha
      status:
        description: "Status (draft, solange die App noch nie veröffentlicht war)"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9
  PACKAGE_NAME: com.javuno.recipes

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 fehlt – ohne Upload-Schlüssel nimmt Google Play das Bundle nicht an."
            exit 1
          fi
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON fehlt – siehe docs/PLAY_STORE.md."
            exit 1
          fi

      - name: Version
        id: version
        run: |
          # Above every CI build number, so Play always sees a higher code.
          CODE=$((1000 + ${{ github.run_number }}))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # No APPCHECK_DEBUG_TOKEN: Play builds use Play Integrity.
      - name: Build App Bundle
        run: >
          flutter build appbundle --release
          --build-number=${{ steps.version.outputs.code }}
          --build-name=${{ steps.version.outputs.name }}
          --dart-define=BUILD_NUMBER=${{ steps.version.outputs.name }}

      # Copying the key on a phone often turns the "\n" in private_key into
      # real line breaks; parse leniently and write clean JSON.
      - name: Prepare service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['PLAY_JSON'].strip(), strict=False)
          path = os.path.join(os.environ['RUNNER_TEMP'], 'play.json')
          with open(path, 'w') as f:
              json.dump(data, f)
          print('service account:', data.get('client_email'))
          PY

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || 'completed' }}

      - uses: actions/upload-artifact@v5
        with:
          name: baco-play-${{ steps.version.outputs.name }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" android/key.properties
