<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BaCo – Einkaufsliste</title>
<link rel="stylesheet" href="../style.css">
<style>
  .item { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 1.1rem; }
  .box { width: 26px; height: 26px; border: 2px solid var(--accent); border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--bg); font-weight: 700; }
  .done .box { background: var(--accent); }
  .done .text { text-decoration: line-through; color: var(--muted); }
  h2 { margin-top: 24px; }
  #state { margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Einkaufsliste</h1>
  <p class="muted" id="hint">Antippen zum Abhaken – alle anderen sehen es sofort.</p>
  <div id="list"></div>
  <p class="muted" id="state">Liste wird geladen …</p>
  <p class="muted" style="margin-top:48px">Geteilt mit <a href="../">BaCo – Bake &amp; Cook</a> · <a href="../datenschutz.html">Datenschutz</a></p>
</main>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// Live shopping list for someone without BaCo: anonymous sign-in, the
// link's token goes into the guest's own users/{uid}.listToken, then the
// Firestore rules allow reading this list and ticking items.
(function () {
  const AISLES = [
    ['produce', 'Obst & Gemüse'], ['bread', 'Brot & Gebäck'],
    ['dairy', 'Milchprodukte & Eier'], ['meat', 'Fleisch & Fisch'],
    ['baking', 'Backen'], ['dry', 'Trockenwaren & Konserven'],
    ['spices', 'Gewürze'], ['frozen', 'Tiefkühl'], ['drinks', 'Getränke'],
    ['other', 'Sonstiges'],
  ];
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t') || '';
  const fail = (text) => {
    $('list').innerHTML = '';
    $('hint').hidden = true;
    $('state').textContent = text;
  };
  if (!/^[A-Za-z0-9]{16,}$/.test(token)) return fail('Dieser Link ist ungültig.');
  if (!window.firebase || !window.BACO_FIREBASE) return fail('Die Liste kann gerade nicht geladen werden.');

  const fmt = (n) => (Math.round(n * 100) / 100).toString().replace('.', ',');
  function qty(it) {
    if (it.amount == null) return '';
    const u = it.unit || '';
    if (u === 'g' && it.amount >= 1000) return fmt(it.amount / 1000) + ' kg';
    if (u === 'ml' && it.amount >= 1000) return fmt(it.amount / 1000) + ' l';
    if (u === 'Stk.' || u === '') return fmt(it.amount);
    return fmt(it.amount) + ' ' + u;
  }

  firebase.initializeApp(window.BACO_FIREBASE);
  const db = firebase.firestore();
  firebase.auth().signInAnonymously()
    .then((cred) => db.doc('users/' + cred.user.uid).set({ listToken: token }, { merge: true }))
    .then(() => db.doc('sharedLists/' + token).get())
    .then((share) => {
      if (!share.exists) throw new Error('gone');
      const s = share.data();
      if (s.expiresAt && s.expiresAt.toDate() < new Date()) throw new Error('gone');
      $('title').textContent = 'Einkaufsliste ' + (s.title || '');
      document.title = 'BaCo – Einkaufsliste ' + (s.title || '');
      const col = db.collection('households/' + s.householdId + '/shopping');
      col.onSnapshot((snap) => render(col, snap.docs), () => fail('Dieser Link gilt nicht mehr.'));
    })
    .catch(() => fail('Dieser Link gilt nicht mehr oder die Liste ist nicht erreichbar.'));

  function row(col, d) {
    const it = d.data();
    const el = document.createElement('div');
    el.className = 'item' + (it.checked ? ' done' : '');
    const box = document.createElement('span');
    box.className = 'box';
    box.textContent = it.checked ? '✓' : '';
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = [qty(it), it.text].filter(Boolean).join(' ');
    el.append(box, text);
    el.onclick = () => col.doc(d.id).update({ checked: !it.checked });
    return el;
  }

  function render(col, docs) {
    const list = $('list');
    list.innerHTML = '';
    $('state').textContent = docs.length ? '' : 'Die Liste ist leer.';
    for (const [key, name] of AISLES) {
      const open = docs.filter((d) => !d.data().checked && (d.data().aisle || 'other') === key);
      if (!open.length) continue;
      const h = document.createElement('h2');
      h.textContent = name;
      list.append(h, ...open.map((d) => row(col, d)));
    }
    const done = docs.filter((d) => d.data().checked);
    if (done.length) {
      const h = document.createElement('h2');
      h.textContent = 'Erledigt';
      list.append(h, ...done.map((d) => row(col, d)));
    }
  }
})();
</script>
</body>
</html>
