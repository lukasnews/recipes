name: recipes
description: "Household recipe app: recipes, shared shopping list and pantry."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.8
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  html: ^0.15.7
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/
    - assets/fonts/
